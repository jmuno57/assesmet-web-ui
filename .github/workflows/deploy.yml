name: Deploy

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SSM_PREFIX: /kata-dev
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read SSM
        id: ssm
        run: |
          set -euo pipefail
          echo "bucket=$(aws ssm get-parameter --name ${SSM_PREFIX}/s3_bucket --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(aws ssm get-parameter --name ${SSM_PREFIX}/cloudfront_id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: Sync S3
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://${{ steps.ssm.outputs.bucket }}" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp dist/index.html "s3://${{ steps.ssm.outputs.bucket }}/index.html" --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.ssm.outputs.distribution }}" --paths "/*"
